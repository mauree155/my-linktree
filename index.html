<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maureen Okoro Links</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
/* --- Reset & Body --- */
body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Orbitron', sans-serif;
    background: #0d0d0d;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: #fff;
}

/* --- Profile picture --- */
.profile-pic {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 3px solid #00cfff;
    box-shadow: 0 0 15px rgba(0, 207, 255, 0.3);
    object-fit: cover;
    margin-bottom: 25px;
    transition: transform 0.5s ease;
}

.profile-pic:hover {
    transform: scale(1.05);
}

/* --- Intro text --- */
h1 {
    margin: 5px 0;
    text-align: center;
    font-weight: 400;
    opacity: 0;
    animation: fadeIn 1s forwards;
    animation-delay: 0.5s;
    font-size: 2.2em;
}

h2 {
    margin: 5px 0;
    text-align: center;
    font-weight: 300;
    color: #b0b0b0;
    font-size: 1.1em;
    min-height: 1.2em; /* prevents jump during typing */
}

/* --- Typewriter effect --- */
@keyframes typing {
    from { width: 0 }
    to { width: 100% }
}
@keyframes blinkCaret {
    50% { border-color: transparent; }
}

.typewriter {
    display: inline-block;
    overflow: hidden;
    white-space: nowrap;
    border-right: 2px solid #00cfff;
    animation: typing 4s steps(80, end), blinkCaret 0.75s step-end infinite;
}

/* --- Buttons --- */
a {
    display: block;
    margin: 15px;
    padding: 15px 35px;
    text-decoration: none;
    color: #fff;
    font-weight: bold;
    font-size: 1.1em;
    border-radius: 10px;
    text-align: center;
    transition: 0.3s ease;
    opacity: 0;
    animation: fadeIn 1s forwards;
    background: linear-gradient(135deg, #00cfff, #006eff);
    box-shadow: 0 4px 10px rgba(0, 207, 255, 0.3);
}

a:nth-of-type(1) { animation-delay: 1.5s; }
a:nth-of-type(2) { animation-delay: 2s; }
a:nth-of-type(3) { animation-delay: 2.5s; }
a:nth-of-type(4) { animation-delay: 3s; }

a:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 20px rgba(0, 207, 255, 0.5);
}

/* --- Fade-in animation --- */
@keyframes fadeIn {
    to { opacity: 1; }
}

/* --- Responsive --- */
@media(max-width: 480px){
    h1 { font-size: 1.8em; }
    a { font-size: 1em; padding: 12px 25px; }
    .profile-pic { width: 140px; height: 140px; }
}
</style>
</head>
<body>

<!-- Profile picture -->
<img src="profile.jpg" alt="Maureen Okoro" class="profile-pic">

<!-- Intro text -->
<h1>Hi, I'm Maureen</h1>
<h2><span class="typewriter">I craft intelligent, deployable solutions from complex data to power better business outcomes</span></h2>

<!-- Social links -->
<a href="https://www.linkedin.com/in/maureen-okoro-8a1972245" target="_blank">LinkedIn</a>
<a href="https://x.com/babywick15?s=21" target="_blank">Twitter</a>
<a href="https://github.com/mauree155" target="_blank">GitHub</a>
<a href="https://medium.com/@okoromaureen590" target="_blank">Medium</a>

</body>
</html>
