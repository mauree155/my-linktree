<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maureen Okoro Links</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
/* --- Reset & Body --- */
body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Orbitron', sans-serif;
    background: #000;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: #00ffe1;
}

/* --- Particle background --- */
canvas#bg {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

/* --- Profile picture --- */
.profile-pic {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 4px solid #00ffe1;
    box-shadow: 0 0 20px #00ffe1, 0 0 40px #00ffe1;
    object-fit: cover;
    animation: pulse 2.5s infinite alternate;
    margin-bottom: 25px;
}

@keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 20px #00ffe1, 0 0 40px #00ffe1; }
    100% { transform: scale(1.05); box-shadow: 0 0 40px #00ffe1, 0 0 80px #00ffe1; }
}

/* --- Intro text --- */
h1, h2 {
    margin: 5px 0;
    text-align: center;
    text-shadow: 0 0 10px #00ffe1, 0 0 20px #00ffe1;
    opacity: 0;
    animation: fadeIn 2s forwards;
}

h1 { font-size: 2.5em; animation-delay: 0.5s; }
h2 { font-size: 1.2em; font-weight: 400; animation-delay: 1.5s; }

@keyframes fadeIn {
    to { opacity: 1; }
}

/* --- Buttons --- */
a {
    display: block;
    margin: 15px;
    padding: 18px 40px;
    text-decoration: none;
    color: #fff;
    font-weight: bold;
    font-size: 1.2em;
    border-radius: 12px;
    text-align: center;
    transition: 0.3s;
    box-shadow: 0 0 5px #00ffe1, 0 0 10px #00ffe1;
    opacity: 0;
    animation: fadeIn 2s forwards;
}

a:nth-of-type(1) { animation-delay: 2.5s; }
a:nth-of-type(2) { animation-delay: 3s; }
a:nth-of-type(3) { animation-delay: 3.5s; }
a:nth-of-type(4) { animation-delay: 4s; }

a.linkedin { background-color: #0077B5; }
a.twitter { background-color: #1DA1F2; }
a.github { background-color: #333; }
a.medium { background-color: #00ab6c; }

a:hover {
    box-shadow: 0 0 25px #00ffe1, 0 0 50px #00ffe1;
    transform: translateY(-5px);
}

/* --- Responsive --- */
@media(max-width: 480px){
    h1 { font-size: 2em; }
    h2 { font-size: 1em; }
    a { font-size: 1em; padding: 15px 30px; }
    .profile-pic { width: 150px; height: 150px; }
}
</style>
</head>
<body>

<!-- Profile picture -->
<img src="profile.jpg" alt="Maureen Okoro" class="profile-pic">

<!-- Intro text -->
<h1>Hi, I'm Maureen</h1>
<h2>I craft intelligent, deployable solutions from complex data to power better business outcomes</h2>

<!-- Social links -->
<a href="https://www.linkedin.com/in/maureen-okoro-8a1972245" class="linkedin" target="_blank">LinkedIn</a>
<a href="https://x.com/babywick15?s=21" class="twitter" target="_blank">Twitter</a>
<a href="https://github.com/mauree155" class="github" target="_blank">GitHub</a>
<a href="https://medium.com/@okoromaureen590" class="medium" target="_blank">Medium</a>

<!-- Particle background script -->
<canvas id="bg"></canvas>
<script>
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const particles = [];
const particleCount = 100;

for(let i=0;i<particleCount;i++){
    particles.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*2+1,
        dx: (Math.random()-0.5)*0.5,
        dy: (Math.random()-0.5)*0.5
    });
}

function animate(){
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    particles.forEach(p=>{
        p.x += p.dx;
        p.y += p.dy;

        if(p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if(p.y < 0 || p.y > canvas.height) p.dy *= -1;

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle = '#00ffe1';
        ctx.fill();
    });

    requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', ()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
